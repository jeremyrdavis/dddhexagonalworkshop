version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: attendee-postgres
    environment:
      POSTGRES_DB: attendeedb
      POSTGRES_USER: attendee_user
      POSTGRES_PASSWORD: attendee_password
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - attendee-network

  wildfly:
    image: quay.io/wildfly/wildfly:31.0.0.Final-jdk11
    container_name: attendee-wildfly
    ports:
      - "8080:8080"
      - "9990:9990"
    environment:
      - WILDFLY_USER=admin
      - WILDFLY_PASS=admin123
    volumes:
      - ./target/attendee-registration.war:/opt/jboss/wildfly/standalone/deployments/attendee-registration.war
      - ./wildfly-setup.cli:/opt/jboss/wildfly/setup.cli
    depends_on:
      - postgres
    networks:
      - attendee-network
    command: >
      bash -c "
        /opt/jboss/wildfly/bin/add-user.sh admin admin123 --silent &&
        /opt/jboss/wildfly/bin/standalone.sh -b 0.0.0.0 -bmanagement 0.0.0.0
      "

volumes:
  postgres_data:

networks:
  attendee-network:
    driver: bridge